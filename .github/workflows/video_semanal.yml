name: Fabrica gratuita de videos

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Tema del Short editorial de GTA VI
        type: choice
        default: gta6-mapa
        options:
          - gta6-mapa
          - gta6-duo
          - gta6-trailer-fps
  schedule:
    - cron: '17 17 * * 3'

concurrency:
  group: fabrica-video-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generar-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Preparar dependencias Python
        timeout-minutes: 10
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          python -m pip install -r requirements.txt

      - name: Preparar FFmpeg y FFprobe
        timeout-minutes: 5
        env:
          FFMPEG_GITHUB_TOKEN: ${{ github.token }}
        run: python tools/setup_ffmpeg.py

      - name: Comprobar regresiones y composición del texto
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Comprobar motor de montaje
        run: python tests/smoke_shorts.py

      - name: Crear Short vertical editorial de GTA VI
        env:
          SHORT_TOPIC: ${{ inputs.topic }}
          YOUTUBE_UPLOAD: 'false'
        run: python -m app.shorts

      - name: Guardar video y archivos de produccion
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: short-gta6
          path: |
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/short_vertical.mp4
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/portada_short.jpg
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/guion.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/voz_*.wav
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/metadata.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/subtitulos.srt
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/subtitulos.ass
          retention-days: 7
          if-no-files-found: warn
