name: Fabrica gratuita de videos

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Curiosidad GTA o dos muestras del formato nuevo
        type: choice
        default: gta6-leonida
        options:
          - muestra
          - gta4-tres-historias
          - sanandreas-tres-ciudades
          - vicecity-ochenta
          - vicecity-voz-cine
          - gta3-libertad
          - gta5-tres-vidas
          - gta6-leonida
      captions:
        description: Subtítulos amarillos con borde negro
        type: boolean
        default: true
      voice:
        description: Voz provisional hasta elegir muestra A o B
        type: choice
        default: em_alex
        options:
          - em_alex
          - em_santa
          - im_nicola
  schedule:
    - cron: '17 17 * * 3'

concurrency:
  group: fabrica-video-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generar-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Preparar dependencias Python
        timeout-minutes: 10
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          python -m pip install -r requirements.txt

      - name: Preparar FFmpeg y FFprobe
        timeout-minutes: 5
        env:
          FFMPEG_GITHUB_TOKEN: ${{ github.token }}
        run: python tools/setup_ffmpeg.py

      - name: Comprobar regresiones y composición del texto
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Comprobar motor de montaje
        run: python tests/smoke_studio.py

      - name: Crear Shorts visuales de curiosidades GTA
        env:
          SHORT_TOPIC: ${{ inputs.topic }}
          SHORT_CAPTIONS: ${{ inputs.captions }}
          SHORT_VOICE: ${{ inputs.voice }}
          YOUTUBE_UPLOAD: 'false'
        run: python -m app.studio

      - name: Guardar video y archivos de produccion
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shorts-gta-studio
          path: |
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/short_vertical.mp4
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/portada_short.jpg
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/guion.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/voz_*.wav
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/metadata.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/subtitulos.srt
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/subtitulos.ass
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/narracion.wav
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/musica_original.wav
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/creditos_visuales.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/ideas_investigadas.json
          retention-days: 7
          if-no-files-found: warn
