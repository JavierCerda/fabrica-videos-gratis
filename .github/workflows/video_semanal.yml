name: Shorts GTA automaticos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video_semanal.yml'
      - 'FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/tests/**'
      - 'FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/app/**'
      - 'FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/assets/**'
      - 'FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/config/**'
      - 'FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/topics/inbox.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Vista previa o produccion y publicacion automatica
        type: choice
        default: production
        options: [production, preview, upload-test]
  schedule:
    - cron: '47 * * * *'

concurrency:
  group: gta-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  producir-publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SHORT_VOICE: es-ES-AlvaroNeural
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_BRIDGE_URL: ${{ secrets.YT_BRIDGE_URL }}
      YT_BRIDGE_KEY: ${{ secrets.YT_BRIDGE_KEY }}
      YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
      RUN_MODE: ${{ inputs.mode || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[upload-test]') && 'upload-test') || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[auto-shorts]') && 'preview') || 'production' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Preparar herramientas gratuitas
        run: |
          python -m pip install -r requirements.txt
          python tools/setup_ffmpeg.py
        env:
          FFMPEG_GITHUB_TOKEN: ${{ github.token }}
      - name: Verificar cola, canal, SEO y motor de montaje
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/smoke_studio.py
      - name: Preparar el motor de voz solo cuando sea necesario
        run: python tools/setup_reference_voice.py --when-needed
      - name: Generar lote o publicar cinco Shorts
        run: python -m app.autopilot --mode "$RUN_MODE"
      - name: Guardar borradores revisados sin publicar
        if: env.RUN_MODE == 'preview'
        run: python -m app.autopilot --mode queue
      - name: Guardar informes de continuidad y publicacion
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-autopilot
          retention-days: 1
          path: |
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/automation_report.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/control_calidad.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/youtube_publication.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/reconocimiento_voz.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/reconocimiento_voz_segunda_pasada.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/reference_voice_info.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/voxcpm_generation.log
      - name: Guardar muestras modernas sin almacenamiento continuo de videos
        if: always() && (env.RUN_MODE == 'preview' || env.RUN_MODE == 'upload-test')
        uses: actions/upload-artifact@v7
        with:
          name: cinco-shorts-modernos
          retention-days: 1
          path: |
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/short_vertical.mp4
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/portada_short.jpg
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/metadata.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/guion.json
      - name: Guardar audio solo si falla la prueba de voz
        if: failure() && (env.RUN_MODE == 'preview' || env.RUN_MODE == 'upload-test')
        uses: actions/upload-artifact@v7
        with:
          name: diagnostico-voz-a1
          retention-days: 1
          path: FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/voz_generada.wav
