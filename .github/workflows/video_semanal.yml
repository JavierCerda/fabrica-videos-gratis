name: Fabrica gratuita de videos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 17 * * 3'

concurrency:
  group: fabrica-video-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generar-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    defaults:
      run:
        working-directory: FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Preparar FFmpeg y dependencias
        run: |
          if ! command -v ffmpeg >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version
          python -m pip install -r requirements.txt

      - name: Comprobar manejo de Gemini
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Comprobar motor de montaje
        run: python tests/smoke.py

      - name: Generar guion voz y video con Gemini y Wikimedia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.1-flash-lite
          GEMINI_TTS_MODEL: gemini-2.5-flash-preview-tts
          GEMINI_VOICE: Charon
          VOICE_PROVIDER: gemini
          YOUTUBE_UPLOAD: 'false'
        run: python -m app.pipeline

      - name: Guardar video y archivos de produccion
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contenido-generado
          path: |
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/video_final.mp4
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/miniatura_youtube.jpg
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/guion.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/voz_*.wav
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/metadata.json
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/subtitulos.srt
            FabricaVideoGratis_SIN_PEXELS_GitHub/FabricaVideoGratis_GitHub_LIMPIO/output/**/creditos_stock.json
          retention-days: 7
          if-no-files-found: warn

